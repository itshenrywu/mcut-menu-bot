name: Get Working Day

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 1 7 *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm ci --omit=dev

    - name: Get working day (current year)
      if: github.event_name == 'workflow_dispatch'
      run: node crawler/working-day.js

    - name: Get working day (next year)
      run: node crawler/working-day.js $(($(date +%Y) + 1))

    - name: Checkout published data
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages-temp

    - name: Skip locked menus
      run: node .github/scripts/filter-locked.js data/menu gh-pages-temp

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./data/menu/
        cname: "mcut-menu-api.henrywu.tw"
        keep_files: true
